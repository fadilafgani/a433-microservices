services:
  # Service aplikasi Item App
  item-app:
    # Membangun image dari Dockerfile dan memberi nama image
    build:
      context: .
      dockerfile: Dockerfile
    image: afgani73/item-app:latest

    # Memetakan port host 80 ke port aplikasi 8080
    ports:
      - "80:8080"

    # Mengarahkan aplikasi ke service database MongoDB
    environment:
      NODE_ENV: production
      DB_HOST: item-db
      PORT: 8080

    # Menunggu database sehat sebelum menjalankan aplikasi
    depends_on:
      item-db:
        condition: service_healthy

    # Menjalankan ulang container jika berhenti
    restart: unless-stopped

  # Service database MongoDB
  item-db:
    image: mongo:4.4

    # Menyimpan data database secara persisten
    volumes:
      - app-db:/data/db

    # Memeriksa kesiapan database sebelum aplikasi dijalankan
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Menjalankan ulang container jika berhenti
    restart: unless-stopped

# Mendefinisikan volume persisten database
volumes:
  app-db: